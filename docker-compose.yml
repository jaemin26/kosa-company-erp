version: "3.8"

services:
  backend:
    image: ${DOCKER_IMAGE_BACKEND}
    ports:
      - "8080:8080"
    environment:
      # application-prod.properties에서 참조할 환경변수들
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_ID=${DB_ID}
      - DB_PW=${DB_PW}
      - APP_CRYPTO_KEY=${APP_CRYPTO_KEY}
      - APP_CORS_ALLOWED_ORIGINS=http://${EC2_PUBLIC_IP}
    restart: unless-stopped

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND}
    ports:
      - "80:3000"
    environment:
      # 컨테이너 내부 통신을 위해 backend 서비스명을 주소로 설정
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_BACKEND_URL=http://${EC2_PUBLIC_IP}:8080
    depends_on:
      - backend
    restart: unless-stopped
