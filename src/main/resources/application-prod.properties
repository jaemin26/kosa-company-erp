# 프로덕션 프로파일 - 모든 민감정보는 환경변수로 주입
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/kosa_erp_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_ID}
spring.datasource.password=${DB_PW}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.crypto.key=${APP_CRYPTO_KEY}
app.file.base-dir=/app/upload
server.servlet.session.cookie.secure=false

# MyBatis - Camel Case
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mapper/**/*.xml

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.company.erp=DEBUG
