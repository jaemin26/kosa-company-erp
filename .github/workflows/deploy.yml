name: Deploy to AWS EC2

on:
  push:
    # deploy 브랜치에 푸시될 때만 실행되도록 수정
    branches: [deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포지토리 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 17 셋팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Gradle 환경 설정 & 빌드
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Backend
        run: gradle bootJar -x test

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 백엔드 Docker 이미지 빌드 및 푸시
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/erp-backend:latest

      # 6. 프론트엔드 Docker 이미지 빌드 및 푸시
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/erp-frontend:latest

      # 7. EC2로 docker-compose.yml 전송
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/"

      # 8. EC2로 서버 배포 및 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 사용할 환경 변수 설정
            export DOCKER_IMAGE_BACKEND=${{ secrets.DOCKER_USERNAME }}/erp-backend:latest
            export DOCKER_IMAGE_FRONTEND=${{ secrets.DOCKER_USERNAME }}/erp-frontend:latest
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DB_ID=${{ secrets.DB_ID }}
            export DB_PW=${{ secrets.DB_PW }}
            export APP_CRYPTO_KEY=${{ secrets.APP_CRYPTO_KEY }}
            export EC2_PUBLIC_IP=${{ secrets.EC2_HOST }}

            # Docker Compose 백그라운드 실행 (최신 이미지 로드)
            docker-compose pull
            docker-compose up -d --remove-orphans

            # 사용하지 않는 이전 이미지 제거
            docker image prune -f
